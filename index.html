<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار تصویری زنده</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: Tahoma, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        #avatar-container {
            width: 100%;
            flex-grow: 1;
            position: relative;
        }
        #controls {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(30, 30, 30, 0.9);
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        input, button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        input {
            background-color: #333;
            color: white;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background-color: #0056b3;
        }
    </style>
    <!-- لود کردن اسکریپت‌های مورد نیاز برای رندر سه‌بعدی و آواتار -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "talkinghead": "https://cdn.jsdelivr.net/gh/metatribal/talkinghead@main/modules/talkinghead.mjs"
        }
      }
    </script>
</head>
<body>

    <div id="avatar-container"></div>

    <div id="controls">
        <input type="text" id="userInput" placeholder="چیزی بنویسید...">
        <button id="sendBtn">ارسال و گفتگو</button>
    </div>

    <script type="module">
        import { TalkingHead } from 'talkinghead';

        const apiKey = "کلید_API_گوگل_خود_را_اینجا_بگذارید";
        let head;

        // مقداردهی اولیه آواتار سه‌بعدی
        async function initAvatar() {
            const container = document.getElementById('avatar-container');

            head = new TalkingHead(container, {
                // استفاده از یک آواتار نمونه رایگان با فرمت glb
                avatarURL: 'https://models.readyplayer.me/64bfa15f0e726f4325a7a9a4.glb',
                cameraDistance: 1.0,
                cameraY: 1.4,
                lipsyncModules: ['en', 'fa'] // پشتیبانی از زبان‌ها
            });

            await head.init();
            head.start();
        }

        // ارسال درخواست به API جمینی و دریافت پاسخ صوتی/متنی
        async function generateResponse(text) {
            if (!text.trim()) return;

            try {
                // فراخوانی API متنی جمینی
                const response = await fetch(`https://generativelative.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                const replyText = data.candidates[0].content.parts[0].text;

                // فرستادن متن به آواتار برای خواندن و متحرک‌سازی دهان
                // نکته: برای خروجی صدا، کتابخانه TalkingHead از مرورگر داخلی گوشی (TTS) استفاده می‌کند
                head.speakText(replyText);

            } catch (error) {
                console.error("خطا در ارتباط با API:", error);
            }
        }

        document.getElementById('sendBtn').addEventListener('click', () => {
            const input = document.getElementById('userInput');
            generateResponse(input.value);
            input.value = '';
        });

        // اجرای اولیه آواتار
        initAvatar();
    </script>
</body>
</html>
